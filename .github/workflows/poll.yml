name: dm-poll

on:
  schedule:
    - cron: "0 */6 * * *" # ~6 saatte bir uzun döngüyü (yeniden) başlat
  workflow_dispatch: {} # elle başlat

# Aynı anda tek döngü çalışsın
concurrency:
  group: poller
  cancel-in-progress: false

permissions:
  contents: write # seen.json'ı repoya geri commit'lemek için

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # ~6 saatlik job sınırının hemen altında güvenlik kapağı
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Emoji fontu (🛣️🔁 render için)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji

      - name: Bağımlılıklar
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Poll döngüsü (~1 dk'da bir)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 21000 ))   # ~5 saat 50 dk döngü, sonra job biter ve schedule yeniden başlatır
          while [ "$(date +%s)" -lt "$END" ]; do
            python poll.py || true
            if ! git diff --quiet seen.json 2>/dev/null; then
              git add seen.json
              git commit -m "chore: seen state [skip ci]" || true
              git push || true
            fi
            sleep 60
          done

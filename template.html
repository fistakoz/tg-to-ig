<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "Noto Sans", "Noto Color Emoji", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Koyu tema DM ekran görüntüsü: ortalı saat + tek balon */
  #card {
    width: 820px;
    background: #0c0d10;
    padding: 26px 22px 40px;
    display: inline-block;
  }

  .time {
    text-align: center;
    color: #9a9aa0;
    font-size: 26px;
    font-weight: 500;
    margin: 6px 0 30px;
  }

  .row {
    display: flex;
    justify-content: flex-start;
  }
  .bubble {
    background: #2b2c33;
    color: #f6f6f8;
    font-size: 34px;
    line-height: 1.34;
    padding: 22px 28px;
    border-radius: 34px;
    max-width: 86%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
</style>
</head>
<body>
  <div id="card">
    <div class="time">{{TIME}}</div>
    <div class="row">
      <div class="bubble">{{BODY}}</div>
    </div>
  </div>
</body>
</html>
